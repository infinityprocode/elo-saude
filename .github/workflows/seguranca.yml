# Teste de isolamento e segurança do banco: roda a cada envio e sob demanda.
# Entra com cada conta de demonstração pela chave pública e confere o que cada uma pode ver e fazer.
name: Seguranca

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca
  cancel-in-progress: false

jobs:
  isolamento:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regras de alerta clínico
        run: npx tsx tests/alertas.ts
      - name: Isolamento entre pacientes, profissionais, clínica e recepção
        run: node tests/isolamento.mjs
        env:
          ELO_SUPABASE_URL: ${{ secrets.ELO_SUPABASE_URL }}
          ELO_SUPABASE_ANON_KEY: ${{ secrets.ELO_SUPABASE_ANON_KEY }}
          ELO_TOKEN_EMERGENCIA: ${{ secrets.ELO_TOKEN_EMERGENCIA }}
          ELO_DEMO_MARINA_SENHA: ${{ secrets.ELO_DEMO_MARINA_SENHA }}
          ELO_DEMO_JOSE_SENHA: ${{ secrets.ELO_DEMO_JOSE_SENHA }}
          ELO_DEMO_CAMILA_SENHA: ${{ secrets.ELO_DEMO_CAMILA_SENHA }}
          ELO_DEMO_PAULA_SENHA: ${{ secrets.ELO_DEMO_PAULA_SENHA }}
          ELO_DEMO_FERNANDO_SENHA: ${{ secrets.ELO_DEMO_FERNANDO_SENHA }}
          ELO_DEMO_RECEPCAO_SENHA: ${{ secrets.ELO_DEMO_RECEPCAO_SENHA }}
          ELO_DEMO_RICARDO_SENHA: ${{ secrets.ELO_DEMO_RICARDO_SENHA }}
